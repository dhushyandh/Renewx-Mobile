name: RenewX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck client
        run: npm run typecheck:client
      - name: Typecheck server
        run: npm run typecheck:server
      - name: Run server tests
        run: npm run test:server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/renewx_ci_test
          JWT_SECRET: ci-only-not-a-real-secret
      - name: Export Expo web build
        run: npm run build:client
